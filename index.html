#hud{flex-wrap:wrap}#op{white-space:pre-line}input,select{font:700 1rem inherit;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;box-sizing:border-box;width:100%;margin-bottom:8px;user-select:text;-webkit-user-select:text}#room{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,15,70,.45);padding:12px;box-sizing:border-box}#room.show{display:flex}#room .box{max-height:94%;overflow:auto}#rcode{font-size:2.4rem;font-weight:800;letter-spacing:.3em;text-align:center;color:var(--acc)}#rl{white-space:pre-line;margin:6px 0 10px;font-weight:700}#rm{color:var(--bad);font-weight:700;min-height:1.2em;margin:6px 0}#rh div{display:flex;gap:6px;margin-bottom:8px}#cb{position:fixed;left:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--acc);background:var(--panel);font-size:1.4rem;z-index:2}

<div id="ov" class="show"><div class="box"><h1 id="ot">Si Ulat Buku 🐛</h1><p id="op">Geser layar (atau tekan panah/WASD) untuk berjalan. Makan buku 📖 dan jawab soalnya agar tubuhmu membesar. Hindari patukan ayam 🐔 dan ambil ❤️ untuk menambah nyawa.</p><button id="ob">Mulai</button><button id="mpb" style="width:100%;margin-top:8px">👥 Main bareng (Room)</button></div></div>
<div id="room"><div class="box"><h1 style="font-size:1.5rem">👥 Room</h1><div id="r1"><input id="rn" maxlength="16" placeholder="Namamu"><select id="rr"><option value="player">Host ikut bermain</option><option value="spectator">Host jadi pengawas</option></select><button id="rc" style="width:100%;background:var(--acc);color:#fff;border-color:var(--acc);margin-bottom:10px">Buat room</button><input id="rk" maxlength="4" placeholder="KODE 4 HURUF" style="text-transform:uppercase"><button id="rj" style="width:100%">Gabung</button></div><div id="r2" style="display:none"><div id="rcode"></div><button id="rcp" style="width:100%;margin:6px 0 10px">📋 Salin kode</button><div id="rl"></div><p id="rinfo"></p><div id="rh"><div><button data-d="180" style="flex:1">3 mnt</button><button data-d="300" style="flex:1">5 mnt</button><button data-d="600" style="flex:1">10 mnt</button></div><select id="rw"><option value="auto">Cuaca: bergantian</option><option value="cerah">Cerah</option><option value="berawan">Berawan</option><option value="mendung">Mendung</option><option value="hujan">Hujan</option><option value="petir">Hujan petir</option><option value="salju">Salju</option><option value="semi">Musim semi</option></select><button id="rstart" style="width:100%;background:var(--acc);color:#fff;border-color:var(--acc)">Mulai (min. 2 pemain)</button></div></div><p id="rm"></p><button id="rx" style="width:100%">Kembali</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const G=THREE,$=id=>document.getElementById(id),R=Math.random,pick=a=>a[R()*a.length|0],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),wp=d=>d-60*Math.round(d/60),ease=k=>k*k*(3-2*k);
const BANK=`Ulat akan berubah menjadi apa?|Kupu-kupu|Katak|Lebah|Capung
Planet tempat kita tinggal?|Bumi|Mars|Venus|Jupiter
Berapa hari dalam seminggu?|7|5|6|8
Campuran merah dan kuning menjadi warna?|Oranye|Hijau|Ungu|Biru
Hewan yang bertelur?|Ayam|Kucing|Sapi|Kambing
Hewan berkaki delapan?|Laba-laba|Semut|Lebah|Lalat
Lambang negara Indonesia?|Garuda Pancasila|Harimau|Naga|Singa
Sila pertama Pancasila?|Ketuhanan Yang Maha Esa|Persatuan Indonesia|Keadilan Sosial|Kemanusiaan
Gas yang kita hirup agar hidup?|Oksigen|Karbon dioksida|Asap|Debu
Tumbuhan membuat makanan lewat?|Fotosintesis|Erosi|Penguapan|Pelapukan
Kemerdekaan Indonesia diproklamasikan tahun?|1945|1925|1955|1965
Air yang membeku menjadi?|Es|Uap|Asap|Awan
Bagian tumbuhan yang menyerap air?|Akar|Daun|Bunga|Buah
Mata uang Indonesia?|Rupiah|Ringgit|Yen|Dolar
Mamalia yang bisa terbang?|Kelelawar|Elang|Lebah|Burung hantu
Setelah ulat menjadi kepompong, lalu menjadi?|Kupu-kupu|Telur|Biji|Tunas
Indera untuk mencium bau?|Hidung|Telinga|Mata|Lidah
Matahari terbit dari arah?|Timur|Barat|Utara|Selatan
Indonesia berada di benua?|Asia|Afrika|Eropa|Amerika
Hewan penghasil madu?|Lebah|Semut|Lalat|Kumbang
Bentuk bumi adalah?|Bulat|Kotak|Datar|Segitiga
Pelangi memiliki berapa warna?|7|5|9|3
Alat untuk melihat bintang?|Teropong|Palu|Sendok|Gunting
Buku adalah jendela?|Dunia|Rumah|Kebun|Pasar`.split('\n').map(l=>l.split('|'));
let deck=[];
function makeQ(){
 if(R()<.4){const t=R()*3|0,a=2+(R()*10|0),b=2+(R()*8|0);let r,q;
  if(t==0){r=a+b;q=`${a} + ${b} = ?`}else if(t==1){const m=Math.max(a,b),n=Math.min(a,b);r=m-n;q=`${m} − ${n} = ?`}else{r=a*b;q=`${a} × ${b} = ?`}
  const st=new Set([r]);while(st.size<4){const v=r+((R()*9-4)|0);if(v>=0)st.add(v)}
  const o=[...st].sort(()=>R()-.5);return{q,o:o.map(String),a:o.indexOf(r)}}
 if(!deck.length)deck=[...BANK].sort(()=>R()-.5);
 const b=deck.pop(),o=b.slice(1,5).sort(()=>R()-.5);return{q:b[0],o,a:o.indexOf(b[1])}}

/* ---------- scene ---------- */
const renderer=new G.WebGLRenderer({canvas:$('c'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new G.Scene(),sky=new G.Color(0x9fdcff);scene.background=sky.clone();scene.fog=new G.Fog(0x9fdcff,28,75);
const cam=new G.PerspectiveCamera(55,1,.1,200);
function rs(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const hemi=new G.HemisphereLight(0xffffff,0x88aa66,.95);scene.add(hemi);const dl=new G.DirectionalLight(0xffffff,.6);dl.position.set(5,10,7);scene.add(dl);
const M=c=>new G.MeshLambertMaterial({color:c}),S=(r,w=16,h=12)=>new G.SphereGeometry(r,w,h);
const mk=(g,c,x=0,y=0,z=0,p)=>{const m=new G.Mesh(g,M(c));m.position.set(x,y,z);p&&p.add(m);return m};
const ground=mk(new G.PlaneGeometry(240,240).rotateX(-Math.PI/2),0x7bd36b,0,0,0,scene);
function tree(x,z,h){mk(new G.CylinderGeometry(.35,.5,h,8),0x8a5a3a,x,h/2,z,scene);mk(S(h*.45),0x3fae5a,x,h+.6,z,scene)}
tree(0,-3,5);mk(new G.CylinderGeometry(.18,.22,3.2,8).rotateX(Math.PI/2),0x8a5a3a,0,5,-1.5,scene);
for(let i=0;i<12;i++){const a=R()*6.28,r=22+R()*10;tree(Math.cos(a)*r,Math.sin(a)*r,4+R()*3)}
for(let i=0;i<45;i++){const x=(R()-.5)*60,z=(R()-.5)*60;mk(new G.CylinderGeometry(.04,.04,.5),0x3a9a3a,x,.25,z,scene);mk(S(.16,8,6),pick([0xff6fa5,0xffd23f,0xffffff,0xb18cff]),x,.55,z,scene)}
const play=new G.Group();scene.add(play);
/* ---------- cuaca, dekorasi, burung ---------- */
const tmpC=new G.Color(),cloudMat=new G.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.7,depthWrite:false}),clouds=[];
for(let i=0;i<16;i++){const c=new G.Group();[[0,0,0,2.2],[2,-.3,.5,1.7],[-2,-.2,-.3,1.8],[.8,.6,-.6,1.6]].forEach(a=>{const m=new G.Mesh(S(a[3],10,8),cloudMat);m.position.set(a[0],a[1],a[2]);m.scale.y=.6;c.add(m)});c.position.set((R()-.5)*120,4.5+R()*1.5,(R()-.5)*120);c.visible=false;scene.add(c);clouds.push(c)}
for(let i=0;i<14;i++){const x=(R()-.5)*58,z=(R()-.5)*58;mk(new G.CylinderGeometry(.1,.12,.35),0xf5e6c8,x,.17,z,scene);mk(S(.3,10,6),0xe5484d,x,.4,z,scene).scale.y=.6}
for(let i=0;i<10;i++)mk(new G.IcosahedronGeometry(.4+R()*.5),0x9aa3ad,(R()-.5)*58,.25,(R()-.5)*58,scene);
for(let i=0;i<10;i++){const x=(R()-.5)*58,z=(R()-.5)*58;mk(S(.8,10,8),0x2f9e4f,x,.5,z,scene);mk(S(.6,10,8),0x39b55c,x+.6,.4,z+.3,scene)}
function mkBird(col,sc,beak){const g=new G.Group(),w=[];mk(S(.35,10,8),col,0,0,0,g).scale.set(1,.9,1.5);mk(S(.22,10,8),col,0,.15,.5,g);mk(new G.ConeGeometry(.08,.25,6).rotateX(Math.PI/2),beak,0,.12,.78,g);mk(new G.ConeGeometry(.15,.5,6).rotateX(-Math.PI/2),col,0,0,-.6,g);
 [-1,1].forEach(x=>{const p=new G.Group();p.position.set(x*.25,.05,0);g.add(p);mk(S(.5,8,6),col,x*.45,0,0,p).scale.set(1,.12,.6);w.push(p)});g.scale.setScalar(sc);g.userData.w=w;return g}
const flap=(b,a)=>{b.userData.w[0].rotation.z=-a;b.userData.w[1].rotation.z=a},dbirds=[];
[0x4aa3ff,0xffd23f,0xff6b6b,0xb18cff,0x34d399,0xff9ecb].forEach((c,i)=>{const b=mkBird(c,.7,0xffa31a),u=b.userData;u.a=R()*6.28;u.r=6+R()*9;u.h=3+R()*3;u.sp=(.35+R()*.3)*(i%2?1:-1);play.add(b);dbirds.push(b)});
function birdsStep(hp){dbirds.forEach(b=>{const u=b.userData,g=Math.sign(u.sp);u.a+=u.sp*.016;b.position.set(hp.x+Math.cos(u.a)*u.r,u.h+Math.sin(time*2+u.r)*.4,hp.z+Math.sin(u.a)*u.r);b.rotation.y=Math.atan2(-Math.sin(u.a)*g,Math.cos(u.a)*g);flap(b,Math.sin(time*12+u.r)*.6)})}
const hawk=mkBird(0x5b3b2a,2.2,0xffa31a);hawk.visible=false;play.add(hawk);
const shad=new G.Mesh(new G.CircleGeometry(1,24).rotateX(-Math.PI/2),new G.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.35,depthWrite:false}));shad.position.y=.04;shad.visible=false;play.add(shad);
const PB={st:0,t:18,x:0,z:0};
function hawkStep(dt,hp){PB.t-=dt;const hr=1.7+s*.4;
 if(PB.st===0){if(PB.t<=0){PB.st=1;PB.t=3.2;hawk.visible=shad.visible=true;banner('🐦 Awas! Burung mengincarmu!',2.5)}}
 else if(PB.st===1){const k=PB.t/3.2,lock=PB.t<=1.4;if(!lock){PB.x=hp.x;PB.z=hp.z}shad.position.x=PB.x;shad.position.z=PB.z;shad.scale.setScalar(hr*(1-.5*k));shad.material.color.set(lock?0xcc0000:0x000000);shad.material.opacity=lock?.5:.35;
  hawk.position.set(PB.x+Math.cos(time*2)*k*7,6+10*k,PB.z+Math.sin(time*2)*k*7);hawk.rotation.x=0;hawk.rotation.y=Math.atan2(PB.x-hawk.position.x,PB.z-hawk.position.z);flap(hawk,Math.sin(time*10)*.6);if(PB.t<=0){PB.st=2;PB.t=.45}}
 else if(PB.st===2){const k=PB.t/.45;hawk.position.set(PB.x,.8+5.2*k,PB.z);hawk.rotation.x=.8;flap(hawk,.1);
  if(PB.t<=0){PB.st=3;PB.t=1.6;shad.visible=false;if(inv<=0&&segs.some(m=>Math.hypot(wp(m.position.x-PB.x),wp(m.position.z-PB.z))<hr)){inv=2;loseLife('Disambar burung! 🐦 −1 ❤️')}}}
 else{hawk.rotation.x=-.3;hawk.position.y+=dt*9;hawk.position.z-=dt*6;flap(hawk,Math.sin(time*14)*.7);if(PB.t<=0){PB.st=0;PB.t=15+R()*15;hawk.visible=false;hawk.rotation.x=0}}}
const CWX=[{n:'☀️ Cerah',sky:0x9fdcff,cl:0,li:.95,gr:0x7bd36b},{n:'⛅ Berawan',sky:0xb5d8ee,cl:6,li:.85,gr:0x74c864},{n:'☁️ Mendung',sky:0x8d9aab,cl:14,li:.6,gr:0x6bb25e},{n:'🌧️ Hujan',sky:0x6c7d95,cl:14,li:.5,gr:0x5fa356,p:'rain',pc:0xbfe3ff,ps:.09},{n:'⛈️ Hujan petir',sky:0x4b566b,cl:16,li:.4,gr:0x5a9a52,p:'rain',pc:0xbfe3ff,ps:.09,bolt:1},{n:'❄️ Salju',sky:0xdbe8f2,cl:10,li:.8,gr:0xf1f6fa,p:'snow',pc:0xffffff,ps:.17},{n:'🌸 Musim semi',sky:0xb8e6ff,cl:3,li:1,gr:0x8fe07a,p:'petal',pc:0xffa6c9,ps:.22}];
const CW={i:0,t:0,lt:3,bt:0};let flash=0,wsp=1;
const bolt=new G.Mesh(new G.TubeGeometry(new G.CatmullRomCurve3([[0,0,0],[.6,3,0],[-.4,6,0],[.7,10,0],[-.5,14,0],[.4,18,0],[0,22,0]].map(p=>new G.Vector3(...p))),16,.15,5),new G.MeshBasicMaterial({color:0xfffbd0}));bolt.visible=false;scene.add(bolt);
function setCW(i,say){CW.i=i;CW.t=0;const n=CWX[i];$('hw').textContent=n.n;prec.visible=!!n.p;if(n.p){prec.material.color.set(n.pc);prec.material.size=n.ps}wsp=n.p==='snow'?.75:1;if(say)banner(n.n+(wsp<1?' – ulat melambat':''),2)}
function precStep(dt,t){const a=pgeo.attributes.position.array;for(let i=0;i<PN;i++){const j=i*3;a[j+1]-=(t==='rain'?15:t==='snow'?2.2:1.6)*dt;if(t!=='rain')a[j]+=Math.sin(time*1.5+i)*dt*(t==='snow'?.8:1.6);if(a[j+1]<0)a[j+1]=11}pgeo.attributes.position.needsUpdate=true}

/* ---------- worm ---------- */
const wg=new G.Group();scene.add(wg);const N=7,segs=[];
for(let i=0;i<N;i++)segs.push(mk(S(.5,20,14),i?(i%2?0x8bdc4f:0x6cc24a):0xb6f26b,0,.5,8+i*.5,wg));
const head=segs[0];
[-1,1].forEach(x=>{mk(S(.15),0xffffff,x*.2,.15,.4,head);mk(S(.075),0x222222,x*.2,.15,.52,head);mk(new G.TorusGeometry(.19,.03,8,16),0x3a2a1a,x*.2,.15,.45,head);
 const an=mk(new G.CylinderGeometry(.02,.02,.5),0x3a7a2a,x*.2,.6,0,head);an.rotation.z=-x*.3;mk(S(.07),0xff6fa5,x*.28,.85,0,head)});
mk(new G.BoxGeometry(.1,.03,.03),0x3a2a1a,0,.15,.6,head);
let pop=0,s=1,tS=1,face=0,eaten=0,lives=3,inv=0,qd=0,streak=0,phase='menu',epoch=0,time=0;

/* ---------- books, hearts, chickens ---------- */
const books=[],hearts=[],chickens=[],bcol=[0xe5484d,0x3b82f6,0xf5a524,0x8b5cf6,0x14b8a6];
function rpos(){let x,z,t=0;do{x=(R()-.5)*54;z=(R()-.5)*54}while(t++<20&&Math.hypot(x-head.position.x,z-head.position.z)<7);return[x,z]}
function addBook(){const g=new G.Group();mk(new G.BoxGeometry(1.1,.34,.8),pick(bcol),0,0,0,g);mk(new G.BoxGeometry(1.14,.24,.7),0xffffff,.05,0,0,g);
 const[x,z]=rpos();g.position.set(x,.6,z);g.userData={ph:R()*6,cool:0,eat:0};play.add(g);books.push(g)}
const hs=new G.Shape();hs.moveTo(25,25);hs.bezierCurveTo(25,25,20,0,0,0);hs.bezierCurveTo(-30,0,-30,35,-30,35);hs.bezierCurveTo(-30,55,-10,77,25,95);hs.bezierCurveTo(60,77,80,55,80,35);hs.bezierCurveTo(80,35,80,0,50,0);hs.bezierCurveTo(35,0,25,25,25,25);
const hgeo=new G.ExtrudeGeometry(hs,{depth:14,bevelEnabled:true,bevelSize:3,bevelThickness:3,bevelSegments:2}).translate(-25,-47,-7).rotateZ(Math.PI).scale(.02,.02,.02);
function addHeart(){const m=new G.Mesh(hgeo,M(0xff3d71));const[x,z]=rpos();m.position.set(x,1.3,z);play.add(m);hearts.push(m)}
