<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Si Ulat Buku</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2250;--panel:#fffdf7;--acc:#7c4dff;--ok:#2fb35a;--bad:#e5484d;--line:#d9d2f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f1ecff;--panel:#2a2347;--line:#4a4075}}
:root[data-theme="dark"]{--ink:#f1ecff;--panel:#2a2347;--line:#4a4075}
html,body{margin:0;height:100%;overflow:hidden;background:#9fdcff;font-family:'Baloo 2',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
.chip{background:var(--panel);color:var(--ink);border-radius:999px;padding:2px 14px;font-weight:800;font-size:1.05rem;box-shadow:0 2px 0 var(--line)}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#bn{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:90%;text-align:center;background:var(--panel);color:var(--ink);padding:4px 16px;border-radius:14px;font-weight:700;display:none;pointer-events:none}
#bn.show{display:block}
#sh{position:fixed;right:10px;top:50%;transform:translateY(-70%);display:none;flex-direction:column;gap:10px}
#sh button{width:64px;height:64px;border-radius:50%;border:3px solid var(--acc);background:var(--panel);color:var(--ink);font:700 1.5rem/1 inherit;display:flex;flex-direction:column;align-items:center;justify-content:center}
#sh small{font-size:.62rem}
#quiz,#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,15,70,.45);padding:12px;box-sizing:border-box}
#quiz.show,#ov.show{display:flex}
#quiz.dock{align-items:flex-end;background:none;pointer-events:none;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#ov.soft{align-items:flex-end;background:none;pointer-events:none}
.box{background:var(--panel);color:var(--ink);border-radius:22px;padding:16px;width:min(440px,100%);box-sizing:border-box;pointer-events:auto;box-shadow:0 6px 0 var(--line)}
.box h1{margin:0 0 6px;font-size:1.9rem;line-height:1.1}
.box p{margin:0 0 12px;line-height:1.35}
#qk{font-weight:700;color:var(--acc)}
#qt{font-size:1.2rem;font-weight:800;margin:2px 0 10px}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box button{font:700 1rem/1.15 inherit;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 8px}
#ob{width:100%;background:var(--acc);color:#fff;border-color:var(--acc);font-size:1.15rem}
#opts button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
#opts button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
#st{position:fixed;width:90px;height:90px;border-radius:50%;border:3px solid #fff8;display:none;pointer-events:none}
#kn{position:absolute;left:28px;top:28px;width:34px;height:34px;border-radius:50%;background:#fffc}
#ov .box,#quiz .box{max-height:94%;overflow:auto}#qi{display:none;max-width:100%;max-height:26vh;margin:0 auto 8px;border-radius:12px;object-fit:contain}#sx{color:var(--bad);font-weight:700;min-height:1.2em;margin:0 0 6px}#hud{flex-wrap:wrap}#op{white-space:pre-line}input,select{font:700 1rem inherit;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;box-sizing:border-box;width:100%;margin-bottom:8px;user-select:text;-webkit-user-select:text}#room{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,15,70,.45);padding:12px;box-sizing:border-box}#room.show{display:flex}#room .box{max-height:94%;overflow:auto}#rcode{font-size:2.4rem;font-weight:800;letter-spacing:.3em;text-align:center;color:var(--acc)}#rl{white-space:pre-line;margin:6px 0 10px;font-weight:700}#rm{color:var(--bad);font-weight:700;min-height:1.2em;margin:6px 0}#rh div{display:flex;gap:6px;margin-bottom:8px}#cb{position:fixed;left:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--acc);background:var(--panel);font-size:1.4rem;z-index:2}

   if(df>=.1){MP.busy=true;B('hits').push({winner:r.u,loser:uid,ts:firebase.database.ServerValue.TIMESTAMP}).then(()=>{hp.x+=dx/dd*3;hp.z+=dz/dd*3;inv=2;loseLife('Ditabrak '+r.d.name+' 💥 −1 ❤️')}).catch(()=>{inv=.5}).then(()=>{MP.busy=false})}
   else if(Math.abs(df)<.1&&MP.bc<=0){MP.bc=.5;hp.x+=dx/dd*2;hp.z+=dz/dd*2}
   break}}
 if(performance.now()-MP.t2>250){MP.t2=performance.now();const l=Math.max(0,Math.ceil((m.endAt-now())/1000));$('hs').textContent=`⭐ ${MP.sc} · ⏱ ${l/60|0}:${String(l%60).padStart(2,'0')}`}
 if(performance.now()-MP.t3>1000){MP.t3=performance.now();if(MP.host){const ps=Object.values(MP.players).filter(p=>p.online!==false);if(now()>=m.endAt||(ps.length&&ps.every(p=>p.phase==='butterfly')))B('meta').update({status:'ended'}).catch(()=>{})}if(now()>=m.endAt+2500)endGame()}}
function mpPost(dt){const sp=MP.role==='spectator';if(sp)wg.visible=false;
 if(!sp&&MP.started){if(phase==='morph'&&mt>=4){const k=ease(Math.min(1,(mt-4)/2));pupa.position.x=hp0.x*(1-k)+SX*k}else if(phase==='pupa')pupa.position.x+=SX;else if(phase==='emerge'){pupa.position.x=SX;if(emerged)bf.position.x+=SX}else if(phase==='fly')bf.position.x+=SX}
 remoteStep(dt);
 let T=null,c=MP.cam;if(c===0&&sp)c=2;const rl=Object.values(MP.remote).filter(r=>r.d.online!==false);
 if(c===0){if(!sp&&(phase==='pupa'||phase==='emerge'||phase==='fly'||(phase==='morph'&&mt>=4)))T=[0,4.6,20,0,3.8,0]}
 else if(c===1){const h=sp?{x:0,z:0}:head.position;T=[h.x+Math.sin(time*.4)*14,9,h.z+Math.cos(time*.4)*14,h.x,.5,h.z]}
 else if(c===2)T=[0,36,13,0,0,0];
 else{const r=rl[(c-3)%Math.max(1,rl.length)];if(r)T=r.vis?[r.hx,8,r.hz+9,r.hx,.5,r.hz-1]:[0,4.6,20,0,3.8,0]}
 if(!T){mcp.copy(cam.position);mlk.copy(lv);return}
 mcp.lerp(tv.set(T[0],T[1],T[2]),.1);mlk.lerp(tv.set(T[3],T[4],T[5]),.15);cam.position.copy(mcp);cam.lookAt(mlk)}
step=function(dt){if(!MP.on||!MP.meta){_step(dt);return}mpTick(dt);_step(dt);mpPost(dt)};

/* ===== HALAMAN AWAL: taburan emas + musik ===== */
(function(){
const cv=document.getElementById('cv'),c=document.getElementById('cvc'),g=c.getContext('2d'),mu=document.getElementById('mu');
let W=0,H=0,run=true;
function fit(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}
fit();addEventListener('resize',fit);
const cols=['#ffe066','#ffd23f','#fff3b0','#ffb300','#ffffff'];
const P=Array.from({length:90},()=>mk(true));
function mk(init){return{x:Math.random()*W,y:init?Math.random()*H:-10,r:1+Math.random()*3.2,vy:12+Math.random()*34,vx:(Math.random()-.5)*14,ph:Math.random()*6.28,sp:2+Math.random()*4,c:cols[Math.random()*cols.length|0],st:Math.random()<.45}}
function star(x,y,r){g.beginPath();g.moveTo(x,y-r*2.4);g.quadraticCurveTo(x,y,x+r*2.4,y);g.quadraticCurveTo(x,y,x,y+r*2.4);g.quadraticCurveTo(x,y,x-r*2.4,y);g.quadraticCurveTo(x,y,x,y-r*2.4);g.fill()}
let t0=performance.now();
function draw(now){if(!run)return;requestAnimationFrame(draw);const dt=Math.min(.05,(now-t0)/1000);t0=now;g.clearRect(0,0,W,H);g.globalCompositeOperation='lighter';
for(const p of P){p.y+=p.vy*dt;p.x+=p.vx*dt;p.ph+=p.sp*dt;if(p.y>H+10||p.x<-10||p.x>W+10){Object.assign(p,mk(false))}
const a=.25+.75*Math.abs(Math.sin(p.ph));g.globalAlpha=a;g.fillStyle=p.c;g.shadowColor='#ffcc33';g.shadowBlur=10;
if(p.st)star(p.x,p.y,p.r);else{g.beginPath();g.arc(p.x,p.y,p.r,0,6.28);g.fill()}}
g.globalAlpha=1;g.shadowBlur=0;g.globalCompositeOperation='source-over'}
requestAnimationFrame(draw);
const bgm=new Audio('https://www.dropbox.com/scl/fi/g5d2vagtvxn9poiwfqwou/pages_of_paper_wings.mp3?rlkey=bcsmy44wzuu52cqrnvk1c6eyq&st=50jdc0ce&raw=1');
bgm.loop=true;bgm.volume=.55;bgm.preload='auto';let muted=false,on=false;
function play(){if(!muted&&on)bgm.play().catch(()=>{})}
mu.onclick=e=>{e.stopPropagation();muted=!muted;mu.textContent=muted?'🔇':'🔊';muted?bgm.pause():play()};
document.addEventListener('visibilitychange',()=>{document.hidden?bgm.pause():play()});
function masuk(){if(on)return;on=true;play();mu.style.display='block';cv.classList.add('out');setTimeout(()=>{run=false;cv.remove()},650)}
cv.addEventListener('click',masuk);
})();
</script>
